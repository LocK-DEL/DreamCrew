name: Bootstrap DreamCrew source

on:
  push:
    branches:
      - agent/foundation

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: agent/foundation
          fetch-depth: 0

      - name: Unpack the verified Phase 1 source snapshot
        run: |
          unzip -o .bootstrap/dreamcrew-phase1.zip -d .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit the source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: establish DreamCrew foundation"
          git push origin HEAD:agent/foundation
